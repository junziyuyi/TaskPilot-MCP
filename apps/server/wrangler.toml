name = "taskpilot-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# 生产站点是 https://task.junziyuyi.top 。本地开发由 .dev.vars 的 WEB_ORIGIN 覆盖。
[vars]
WEB_ORIGIN = "https://task.junziyuyi.top"

[[routes]]
pattern = "task.junziyuyi.top"
zone_name = "junziyuyi.top"
custom_domain = true

# /api 与 /mcp 进 Worker，其余路径用静态看板，未知路径回 index.html。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp"]

[[d1_databases]]
binding = "DB"
database_name = "taskpilot"
database_id = "ee660656-9e7d-4ca9-9c88-c4b5e0e1e729"
migrations_dir = "migrations"
